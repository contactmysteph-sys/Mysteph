<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Japan Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/image-viewer.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:
    linear-gradient(rgba(246,245,242,0.95), rgba(246,245,242,0.95)),
    url("Images/japan/kyoto1.jpg");
  background-size:cover;
  background-attachment:fixed;
  font-family:'Montserrat', sans-serif;
  color:#2d3e52;
}

a{
  text-decoration:none;
  color:inherit;
}

img{
  width:100%;
  display:block;
}

/* BACK */

.back-home{
  display:inline-block;
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:#31476E;
  border-bottom:1px solid #31476E;
  padding-bottom:5px;
  margin-left:9%;
  margin-top:36px;
}

/* INTRO */

.intro{
  width:min(900px,90%);
  margin:28px auto 18px;
  text-align:center;
}

.intro span{
  font-family:'Caveat', cursive;
  font-size:25px;
  letter-spacing:2.5px;
  font-weight:600;
  color:#29313c;
}

.intro h1{
  margin-top:8px;
  font-family:'Cormorant Garamond', serif;
  font-size:16px;
  color:#505e75;
}

/* MAIN SECTION */

.detail-section{

  width:min(1450px, 92%);
  margin:0 auto 90px;
  background:rgba(255,255,255,0.82);
  border:1px solid rgba(49,71,110,0.10);
  padding:50px 55px;
  box-shadow:0 18px 50px rgba(49,71,110,0.06);
}

/* NOTE */

.note{
  max-width:800px;
  margin-top:40px;
  padding-top:30px;
  border-top:1px solid rgba(49,71,110,.15);
  font-size:14px;
  line-height:2;
  color:#566171;
  white-space:normal;
}

#story-area{
   width:100%;
}

.story img{
    cursor: zoom-in;
}

.photo-single{

  margin-bottom: 16px;
}

.photo-single img{

  width: 100%;
  height: 340px;
  object-fit: cover;
  border-radius: 6px;
}

.photo-row{
    display:grid;
    gap:14px;
    margin-top:18px;
    margin-bottom:14px;
}

.photo-row.two{
    grid-template-columns:repeat(2,1fr);
}

.photo-row.three{
    grid-template-columns:repeat(3,1fr);
}

.photo-row.four{
    grid-template-columns:repeat(4,1fr);
}

.photo-row.five{
    grid-template-columns:repeat(5,1fr);
}

.photo-row img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:6px;
}

.story img{
  cursor: zoom-in;
}

.story p{
    margin:0 0 14px;
    font-size:14px;
    line-height:1.9;
    color:#444;
    white-space:pre-line;
    margin-bottom:10px;
}

.journal-layout{
  display:grid;
  grid-template-columns:
      minmax(0, 1fr)
      clamp(180px, 22vw, 280px);
  gap:clamp(24px, 4vw, 70px);
  align-items:start;
}

.journal-main{
  min-width:0;
}

.journal-main h1{
  margin-bottom:15px;
  font-family:'Cormorant Garamond', serif;
  font-size:18px;
  color:#31476E;
}

.journal-main h2{
  margin-bottom:13px;
  font-family:'Cormorant Garamond', serif;
  font-size:14px;
  color:#504755;
}

.journal-sidebar{
  position:sticky;
  top:30px;
  align-self: start;
  height: calc(100vh - 60px);
}

.journal-sidebar h3{
  margin-bottom:18px;
  font-family:'Cormorant Garamond', serif;
  font-size:24px;
  color:#31476E;
}

.side-card{

  display:flex;
  gap:12px;
  margin-bottom:0;
  padding:14px 0;
  border-bottom:1px solid rgba(49,71,110,.15);
  border-radius:0;
  background:transparent;
  transition:.25s;
}

.side-card:hover{

  transform:none;
  background:rgba(255,255,255,.35);
}

.side-card img{
  width:85px;
  height:78px;
  object-fit:cover;
  border-radius:6px;
  flex-shrink:0;
}

.side-card strong{
  display:block;
  margin-bottom:4px;
  font-size:13px;
  color:#31476E;
}

.side-card span{
  font-size:12px;
  line-height:1.5;
  color:#364354;
}

.city-scroll{

    max-height: 70vh;
    overflow-y: auto;
    padding-right: 8px;
    height: 100%;
}

.city-scroll::-webkit-scrollbar{

    width: 6px;
}

.city-scroll::-webkit-scrollbar-track{

    background: rgba(0,0,0,.05);
}

.city-scroll::-webkit-scrollbar-thumb{

    background: rgba(49,71,110,.35);

    border-radius: 999px;
}

.city-scroll::-webkit-scrollbar-thumb:hover{

    background: rgba(49,71,110,.55);
}

.link{
    color:#4d82b8;
    font-weight:400;
    text-decoration:none;
    border-bottom:1px solid #4d82b8;
    transition:.25s;
    font-size: 11px;
}

.link:hover{
    color:#1f5f9b;
    border-bottom-color:#1f5f9b;
}

/* MOBILE */
@media (max-width:768px){

  .journal-layout{
      grid-template-columns:1fr;
      gap:40px;
  }

  .journal-sidebar{
      position:static;
      height:auto;
  }

}

@media(max-width:650px){

  body{
    background-attachment:scroll;
  }

  .back-home{
    font-size:8px;
    letter-spacing:1px;
    padding-bottom:3px;
    margin-left:6%;
    margin-top:18px;
  }

  .intro{
    width:88%;
    margin:24px auto 18px;
  }

  .intro span{
    font-size:18px;
    letter-spacing:2px;
  }
  
  .journal-main h1{
    font-size:14px;
    color:#31476E;
  }

  .journal-main h2{
    font-size:12px;
    color:#504755;
  }
  .detail-section{
    width:88%;
    margin:0 auto 30px;
    padding:20px 12px;
  }

  .place-list{
    margin:20px 0;
    gap:6px;
  }

  .place-list button{
    font-size:9px;
    letter-spacing:0.8px;
    padding:7px 9px;
  }

  .photo-row{

    justify-items:center;
    gap:14px;
  }

  .photo-row.two,
  .photo-row.three,
  .photo-row.four,
  .photo-row.five{
    grid-template-columns:1fr;
  }

  .photo-row img{

    width:85%;
    max-width:280px;
    height:180px;
  }

  .journal-layout{
     grid-template-columns:1fr;
   }

  .journal-sidebar{
     position:static;
     margin-top:30px;
    }

  .city-scroll{

     max-height:none;
     overflow-y:visible;
     padding-right:0;
    }

  .note{
    margin-top:18px;
    padding-top:20px;
    font-size:12px;
    line-height:1.5;
    letter-spacing:0.5px;
  }
}
</style>

function showCity(city){

    const area = document.getElementById("story-area");

    if(!cities[city]){
        area.innerHTML = "<h2>Coming Soon</h2>";
        return;
    }

    area.innerHTML = cities[city];

    if(typeof initImageViewer === "function"){
        initImageViewer();
    }

    console.log(document.getElementById("story-area").innerHTML);


    // 페이지 상단으로 부드럽게 이동
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

// URL에서 city 값 읽기
const params = new URLSearchParams(window.location.search);
const city = params.get("city");

showCity(city || "nagasaki");

// 사이드바 클릭 이벤트
document.querySelectorAll(".side-card").forEach(card => {

    card.addEventListener("click", function(e){

        e.preventDefault();

        showCity(this.dataset.city);

    });

});
