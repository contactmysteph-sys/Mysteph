<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aquariums</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/image-viewer.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      background:
        linear-gradient(rgba(246,250,250,0.88), rgba(246,250,250,0.9)),
        url("Images/healing/lonm1.jpg");
      background-size:cover;
      background-position:center;
      background-attachment:fixed;
      font-family:'Montserrat', sans-serif;
      color:#2d3e52;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    img{
      width:100%;
      display:block;
      -webkit-user-drag:none;
      user-select:none;
    }

    .back-wrapper{
      width:min(1200px,90%);
      margin:18px auto 0;
    }

    .back-home{
      display:inline-block;
      font-size:10px;
      letter-spacing:1.3px;
      text-transform:uppercase;
      color:#31476E;
      border-bottom:1px solid rgba(49,71,110,0.5);
      padding-bottom:4px;
    }

    .back-home:hover{
      opacity:0.65;
    }

    .intro{
      width:min(900px,90%);
      margin:46px auto 34px;
      text-align:center;
    }

    .intro span{
      font-family:'Quicksand', sans-serif;
      font-size:16px;
      letter-spacing:2px;
      font-weight:600;
      color:#637c9e;
    }

    .intro h1{
      margin-top:8px;
      font-family:'Cormorant Garamond', serif;
      font-size:32px;
      font-weight:500;
      color:#31476E;
      letter-spacing:0.5px;
    }

    .journey-grid{
      width:min(1200px,90%);
      margin:0 auto 34px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }

    .journey-card{
      position:relative;
      min-height:40px;
      padding:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      overflow:hidden;
      background:
        linear-gradient(rgba(140, 161, 161, 0.88), rgba(246,250,250,0.9),
        rgba(199, 239, 239, 0.9));
      border:1px solid rgba(49,71,110,0.22);
      cursor:pointer;
      transition:0.3s ease;
    }

    .journey-card img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:0.42;
      z-index:0;
    }

    .journey-card::after{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(255,255,255,0.56);
      z-index:1;
    }

    .journey-card-content{
      position:relative;
      z-index:2;
    }

    .journey-card:hover{
      transform:translateY(-5px);
      box-shadow:0 18px 45px rgba(49,71,110,0.12);
    }

    .journey-card.active{
      border-color:#31476E;
      box-shadow:0 0 0 1px rgba(49,71,110,0.25);
      background:rgba(255,255,255,0.92);
    }

    .journey-card-content span{
      display:block;
      font-size:10px;
      letter-spacing:4px;
      text-transform:uppercase;
      color:#4e607a;
    }

    .journey-card-content h3{
      margin-top:10px;
      font-family:'Quicksand', sans-serif;
      font-size:16px;
      font-weight:600;
      color:#1e293c;
      letter-spacing:0.3px;
    }

    .detail-section{
      width:min(1200px,90%);
      margin:0 auto 80px;
      padding:38px;
      background:rgba(255,255,255,0.78);
      border:1px solid rgba(49,71,110,0.14);
      box-shadow:0 18px 50px rgba(49,71,110,0.08);
    }

    .detail-top h2{
      margin:8px 0 12px;
      font-family:'Cormorant Garamond', serif;
      font-size:22px;
      font-weight:500;
      color:#31476E;
    }

    .detail-top p{
      max-width:760px;
      font-size:16px;
      line-height:1.7;
      color:#566171;
      white-space:pre-line;
    }

    .place-list{
      margin:26px 0;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .place-list button{
      padding:8px 13px;
      background:rgba(238,243,247,0.9);
      border:1px solid rgba(49,71,110,0.12);
      font-size:10px;
      letter-spacing:1px;
      color:#46566b;
      cursor:pointer;
      transition:0.25s ease;
    }

    .place-list button:hover,
    .place-list button.active{
      background:#31476E;
      color:white;
      border-color:#31476E;
    }

    .photo-grid{
      margin-top:28px;
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:14px;
    }

    .photo-grid img{
      height:150px;
      object-fit:cover;
      border-radius:4px;
      cursor:zoom-in;
    }

    .note{
      max-width:820px;
      margin-top:34px;
      padding-top:26px;
      border-top:1px solid rgba(49,71,110,.15);
      font-size:13px;
      line-height:1.8;
      color:#566171;
      white-space:pre-line;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.85);
      z-index:9999;
      justify-content:center;
      align-items:center;
    }

    .modal img{
      max-width:68vw;
      max-height:82vh;
      border-radius:10px;
      cursor:grab;
      user-select:none;
    }

    .close-btn{
      position:absolute;
      top:24px;
      right:32px;
      color:#fff;
      font-size:34px;
      cursor:pointer;
      z-index:10000;
    }

    .modal-nav{
      position:fixed;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:rgba(255,255,255,0.8);
      color:#111;
      font-size:34px;
      width:44px;
      height:44px;
      border-radius:50%;
      cursor:pointer;
      z-index:10000;
    }

    .modal-nav.prev{ left:18px; }
    .modal-nav.next{ right:18px; }

    @media(max-width:650px){
      body{
        background-attachment:scroll;
      }

      .back-wrapper{
        width:88%;
        margin:12px auto 0;
      }

      .back-home{
        font-size:8px;
        letter-spacing:1px;
        padding-bottom:3px;
      }

      .intro{
        width:88%;
        margin:26px auto 18px;
      }

      .intro span{
        font-size:14px;
        letter-spacing:1.5px;
      }

      .intro h1{
        font-size:17px;
      }

      .intro p{
        display:none;
      }

      .journey-grid{
        width:88%;
        margin:0 auto 22px;
        grid-template-columns:repeat(2, 1fr);
        gap:7px;
      }

      .journey-card{
        min-height:56px;
        padding:6px;
      }

      .journey-card-content span{
        display:none;
      }

      .journey-card-content h3{
        margin-top:0;
        font-size:12px;
      }

      .detail-section{
        width:88%;
        margin:0 auto 34px;
        padding:20px 12px;
      }

      .detail-top span{
        font-size:9px;
        letter-spacing:2px;
      }

      .detail-top h2{
        margin:6px 0 8px;
        font-size:17px;
      }

      .detail-top p{
        display:none;
      }

      .place-list{
        margin:18px 0;
        gap:8px;
      }

      .place-list button{
        font-size:9px;
        letter-spacing:1px;
        padding:7px 10px;
      }

      .photo-grid{
        margin-top:22px;
        grid-template-columns:repeat(2, 1fr);
        gap:10px;
      }

      .photo-grid img{
        height:135px;
      }

      .note{
        margin-top:18px;
        padding-top:18px;
        font-size:11px;
        line-height:1.5;
      }

      .modal img{
        max-width:82vw;
        max-height:78vh;
      }
    }
  </style>
</head>

  <script>
    const journeys = {
      towada: {
        title: "Towada Art Center",
        desc: "AOMORI, Japan",
        places: [
          {
            name: "towada",
            images: [

            ],
            note: `겨울 노천을 즐기러 간 Aomori에서 뜻밖의 발견.
            눈 덮인 풍경 속에서 미술 작품을 감상하는 경험은 특별하고 이 작은 시골 마을에 이렇게 훌륭한 미술관과 작품들이 있다는 것이 문화적 충격으로 다가오면서 부럽다는 생각이 들었다.
            이후 어딜 가든 미술관을 찾아가게 된 계기가 되었다.`
          },
        ],
      },

      benesse: {
        title: "Benesse House",
        desc: "Naoshima, Japan",
        places: [   
          {
            name: "benesse",
            images: [
              "Images/healing/benesse1.jpg",
              "Images/healing/benesse11.jpg",
              "Images/healing/benesse3.jpg",
              "Images/healing/benesse4.jpg",
              "Images/healing/benesse9.jpg",
              "Images/healing/benesse10.jpg",
              "Images/healing/benesse12.jpg",
              "Images/healing/benesse15.jpg",
              "Images/healing/benesse16.jpg",
              "Images/healing/benesse17.jpg",
              "Images/healing/benesse13.jpg",
              "Images/healing/benesse14.jpg",
            ],
            note: `섬 하나를 미술관으로 만든 그들의 아이디어에 감동.
            인구가 줄어드는 섬에 미술관을 세우고, 그 안에 호텔과 레스토랑까지 만들어서 관광객을 유치하고 지역 경제를 살리는 아이디어가 놀라웠다. 
            거기에 있는 작품들 또한 미술에 문외한인 나를 감동시키고 그 상상력과 창의성에 놀라움을 금치 못했다.`
          },
        ],
      },

      kanazawa: {
        title: "21st Century Museum of Contemporary Art",
        desc: "Kanazawa, Japan",
        places: [   
          {

              "Images/healing/kana3.jpg",
              "Images/healing/kana4.jpg",
              "Images/healing/kana5.jpg",
              "Images/healing/kana6.jpg",
              "Images/healing/kana8.jpg",

            ],
            note: `Benesse House 다음으로 마음에 들었던 곳.
            미술관 건축물부터 정원처럼 꾸며진 산책 공간 등 부러운 공간이었다.

            ],

      london: {
        title: "The National Gallery",

            images: [

              "Images/healing/lonm6.jpg",

            ],

      kualalumpur: {

              "Images/healing/kl7.jpg",
              "Images/healing/kl8.jpg",
              "Images/healing/kl1.jpg",
              "Images/healing/kl11.jpg",
              "Images/healing/kl12.jpg",
              "Images/healing/kl14.jpg",
              "Images/healing/kl5.jpg",
      
    
            ],
            note: `One of the things I love about Kuala Lumpur is that art can be found almost everywhere, even in places you wouldn't expect, like a hospital. 
            Every walk offers a chance to pause, admire a piece, and enjoy the simple pleasure of discovering something unexpected.`
          },
        ],
    
      },
    };

  function showJourney(id, button){
     const data = journeys[id];
     if(!data) return;

     document.getElementById("detail-title").innerText = data.title;
     document.getElementById("detail-desc").innerText = data.desc || "";

     showPlace(id, 0);

     document.querySelectorAll(".journey-card").forEach(card => {
       card.classList.remove("active");
    });

    if(button) button.classList.add("active");
  }

  function showPlace(journeyId, placeIndex){
     const place = journeys[journeyId].places[placeIndex];
     const grid = document.getElementById("photo-grid");

     grid.innerHTML = place.images.map(img => `
        <img class="zoomable" src="${img}" alt="" loading="lazy" decoding="async">
     `).join("");

     document.getElementById("detail-note").innerText = place.note || "";
  }

  function openFromUrl(){
     const params = new URLSearchParams(window.location.search);
     const targetJourney = params.get("journey");

     if(targetJourney && journeys[targetJourney]){
        const journeyBtn = document.querySelector(
         `.journey-card[onclick*="'${targetJourney}'"]`
      );

      showJourney(targetJourney, journeyBtn);
      return;
    }

    showJourney("towada", document.querySelector(".journey-card"));
  }

  openFromUrl();

  </script>

    <button id="modal-prev" class="modal-nav prev" type="button">‹</button>
    <span id="close-btn" class="close-btn">&times;</span>
    <img id="modal-img" src="" alt="">
    <button id="modal-next" class="modal-nav next" type="button">›</button>
  </div>

  <script src="js/image-viewer.js"></script>

  <script>
    document.addEventListener("contextmenu", function(e){
      if(e.target.tagName === "IMG"){
        e.preventDefault();
      }
    });

    document.addEventListener("dragstart", function(e){
      if(e.target.tagName === "IMG"){
        e.preventDefault();
      }
    });
  </script>
