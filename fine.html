<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  overflow-x:hidden;
}

body{
  background:
 
  linear-gradient(
    rgba(215, 217, 241, 0.95),
    rgba(198, 198, 246, 0.95)
  );

    font-family:'Montserrat', sans-serif;
    color:#2c343e;
  
}

a{
  text-decoration:none;
  color:inherit;
}

.back-wrap{
  width:min(1120px,90%);
  margin:28px auto 0;
}

.back-link{
  font-size:11px;
  letter-spacing:1.0px;
  text-transform:uppercase;
  color:#232831;
}

.hero{
  text-align:center;
  padding:30px 20px 24px;
}


.hero h1{
  position:relative;
  display:inline-block;

  font-family:'Parisienne', cursive;
  font-size:58px;
  font-weight:400;
  letter-spacing:1px;

  color:#1f2f55;

  text-shadow:
    0 0 6px rgba(255,255,255,0.8),
    0 0 14px rgba(201,161,90,0.45);

  animation:softGlow 2.8s ease-in-out infinite;
}

@keyframes softGlow{
  0%{
    opacity:0.82;
    text-shadow:
      0 0 4px rgba(255,255,255,0.6),
      0 0 8px rgba(201,161,90,0.25);
  }

  50%{
    opacity:1;
    text-shadow:
      0 0 8px rgba(255,255,255,0.95),
      0 0 18px rgba(201,161,90,0.65),
      0 0 28px rgba(201,161,90,0.35);
  }

  100%{
    opacity:0.82;
    text-shadow:
      0 0 4px rgba(255,255,255,0.6),
      0 0 8px rgba(201,161,90,0.25);
  }
}

.hero h1::after{
  content:"";
  position:absolute;
  top:0;
  left:-40%;
  width:40%;
  height:100%;

  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.75),
    transparent
  );

  transform:skewX(-20deg);
  animation:shineMove 3.5s ease-in-out infinite;
}

@keyframes shineMove{
  0%{
    left:-50%;
    opacity:0;
  }

  35%{
    opacity:0.8;
  }

  70%{
    left:110%;
    opacity:0;
  }

  100%{
    left:110%;
    opacity:0;
  }
}


.fine-wrapper{
  width:min(1120px,90%);
  margin:0 auto 80px;
}


.restaurant-card{
  background:rgba(255,255,255,0.72);
  border-radius:26px;
  padding:24px;
  border:1px solid rgba(255,255,255,0.75);
  box-shadow:0 16px 40px rgba(0,0,0,0.06);
  height:auto;
}
.restaurant-header{
  margin-bottom:20px;
  padding-bottom:14px;
  border-bottom:1px solid rgba(49,71,110,0.08);
}

.restaurant-header h3{
  font-family:'Cormorant Garamond', serif;
  font-size:22px;
  font-weight:600;
  color:#192335;
  margin-bottom:4px;
}

.restaurant-header span{
  display:block;
  font-size:11px;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color:#151d25;
}
.photo-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:10px;
  margin-bottom:24px;
}

.photo-grid img{
  width:100%;
  height:150px;
  object-fit:cover;
  display:block;
  border-radius:14px;
}

.restaurant-info span{
  display:block;
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#0f161f;
  margin-bottom:12px;
}

.restaurant-meta{
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#383e45;
  margin-bottom:12px;
}
.restaurant-info p{
  font-size:13px;
  line-height:1.5;
  color:#27313d;
  margin-bottom:10px;
}

.restaurant-layout{
    overflow:hidden;
    position:relative;
}

.slider-track{
    display:flex;
    width:100%;
    will-change:transform;
}

.slide-page{
    min-width:100%;
    display:flex;
    gap:28px;
    align-items:flex-start;
}

.slide-page > .restaurant-card{
    flex:1 1 0;
}

.slide-column{
    flex:1;
    display:flex;
    flex-direction:column;
}

.pager{
  display:none;
  justify-content:center;
  align-items:center;
  gap:28px;
  margin-top:34px;
}

.pager button{
  border:none;
  background:transparent;
  font-family:'Cormorant Garamond', serif;
  font-size:32px;
  color:#292c30;
  cursor:pointer;
}

.page-count{
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#8a96a5;
}

@media(max-width:900px){
  
  .restaurant-layout{
    grid-template-columns:1fr;
    gap:8px;
  }

  .fine-wrapper{
    width:92%;
    margin:0 auto 40px;
  }

  .restaurant-card{
    width:100%;
    margin:0 auto 8px;
    padding:22px;
    border-radius:20px;
  }

  .restaurant-header{
    margin-bottom:16px;
    padding-bottom:12px;
  }

  .restaurant-header h3{
    font-size:16px;
  }

  .restaurant-header span{
    font-size:11px;
    letter-spacing:1.3px;
  }

  .photo-grid{
    grid-template-columns:repeat(2,1fr);
    gap:6px;
    margin-bottom:14px;
  }

  .photo-grid img{
    height:120px;
    border-radius:10px;
  }

  .restaurant-info span{
    font-size:11px;
    letter-spacing:1.5px;
  }

  .restaurant-info p{
    font-size:11px;
    line-height:1.45;
    margin-bottom:6px;
  }
}

@media(max-width:600px){

.back-wrap{
  width:92%;
  margin:14px auto 0;
  padding-left:8px;
  overflow:hidden;
}

.back-link{
  display:block;
  width:fit-content;
  font-size:8px;
  letter-spacing:0.7px;
  line-height:1.2;
  margin-left:0;
}

.hero{
  padding:10px 12px 8px;
}

.hero h1{
   font-size:24px;
   line-height:1;
   letter-spacing:0;
   animation:none;
}

.hero h1::after{
    display:none;
}
}

/* IMAGE MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:9999;
  justify-content:center;
  align-items:center;
}

.modal img{
  max-width:80%;
  max-height:85%;
  border-radius:10px;
  cursor:grab;
  user-select:none;
}

.close-btn{
  position:absolute;
  top:24px;
  right:32px;
  color:#fff;
  font-size:34px;
  cursor:pointer;
}

.photo-grid img{
  cursor:zoom-in;
}

.modal-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(255,255,255,0.75);
  border:none;
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:34px;
  cursor:pointer;
  z-index:10;
}

.modal-nav.prev{
  left:30px;
}

.modal-nav.next{
  right:30px;
}

@media (max-width:768px){

    .slide-page{
        display:block;
    }

    .slide-page > .restaurant-card{
        width:100%;
    }

    .pager{
      display:none;
    }
}


</style>

// ==============================
// Fine Dining Slider
// ==============================

const restaurantLayout = document.getElementById("restaurantLayout");
const sliderTrack = document.getElementById("sliderTrack");
const pageCount = document.getElementById("pageCount");

let isSwipeGesture = false;
let perPage = window.innerWidth <= 768 ? 1 : 2;

let currentPage = 0;
let totalPages = 0;

let startX = 0;
let currentX = 0;
let isDragging = false;
let currentTranslate = 0;
let previousTranslate = 0;
let animationID;


// ==============================
// Star Rating
// ==============================

function getStars(rating){

    const full = Math.floor(rating);
    const half = rating % 1 >= 0.5;

    let stars = "";

    for(let i=0;i<full;i++){
        stars += "★";
    }

    if(half){
        stars += "½";
    }

    return `${stars} (${rating.toFixed(1)})`;

}

// ==============================
// Card HTML
// ==============================

function createCard(place){

    return `

    <article class="restaurant-card">

        <div class="restaurant-header">

            <h3>${place.title}</h3>

            <span>
                ${place.location} · ${place.date}
            </span>

        </div>

        <div class="photo-grid">

            ${place.images.map(img=>`

             <img
               src="${img}"
               alt="${place.title}"
               loading="lazy"
               decoding="async"
               draggable="false"
              >

            `).join("")}

        </div>

        <div class="restaurant-info">

            <span>

                ${place.category}
                ·
                ${getStars(place.rating)}

            </span>

            ${place.body}

        </div>

    </article>

    `;

}


function buildSlider(){

    sliderTrack.innerHTML = "";

    const sortedRestaurants = [...restaurants].sort(
        (a,b)=>new Date(b.date)-new Date(a.date)
    );

    totalPages = Math.ceil(sortedRestaurants.length / perPage);

    for(let page=0; page<totalPages; page++){

        const slide = document.createElement("div");
        slide.className = "slide-page";

        // 좌우 컬럼 생성
        const leftCol = document.createElement("div");
        leftCol.className = "slide-column";

        const rightCol = document.createElement("div");
        rightCol.className = "slide-column";

        const start = page * perPage;
        const items = sortedRestaurants.slice(start, start + perPage);

        // 카드 하나씩 넣기
        if(items[0]){
            leftCol.innerHTML = createCard(items[0]);
        }

        if(items[1]){
            rightCol.innerHTML = createCard(items[1]);
        }

        slide.appendChild(leftCol);
        slide.appendChild(rightCol);

        sliderTrack.appendChild(slide);
    }
}

// ==============================
// Update Slider Position
// ==============================

function updateSlider(animate = true){

    if(animate){
        sliderTrack.style.transition =
            "transform .45s cubic-bezier(.22,.61,.36,1)";
    }else{
        sliderTrack.style.transition = "none";
    }

    currentTranslate = -(currentPage * restaurantLayout.offsetWidth);

    sliderTrack.style.transform =
        `translateX(${currentTranslate}px)`;

    previousTranslate = currentTranslate;

    updatePager();

}



// ==============================
// Pager
// ==============================

function updatePager(){

    pageCount.textContent =
        `${currentPage + 1} / ${totalPages}`;

}



// ==============================
// Previous / Next
// ==============================

function movePage(step){

    currentPage += step;

    if(currentPage < 0){
        currentPage = totalPages - 1;
    }

    if(currentPage >= totalPages){
        currentPage = 0;
    }

    updateSlider(true);
    scrollToRestaurantTop();

    // 페이지가 바뀌면 카드 영역의 맨 위로 이동
    window.scrollTo({
        top: restaurantLayout.offsetTop - 20,
        behavior: "smooth"
    });

}



// ==============================
// Resize
// ==============================

window.addEventListener("resize", () => {

    const newPerPage = window.innerWidth <= 768 ? 1 : 2;

    if (newPerPage !== perPage) {

        // 현재 보이는 첫 카드 인덱스 저장
        const firstVisibleIndex = currentPage * perPage;

        perPage = newPerPage;

        buildSlider();

        // 같은 카드를 계속 보도록 페이지 계산
        currentPage = Math.floor(firstVisibleIndex / perPage);

        // 혹시 마지막 페이지를 넘어가면 보정
        currentPage = Math.min(currentPage, totalPages - 1);
    }

    updateSlider(false);

});

// ==============================
// Drag & Swipe
// ==============================

function animation(){

    sliderTrack.style.transform =
        `translateX(${currentTranslate}px)`;

    if(isDragging){

        requestAnimationFrame(animation);

    }

}


function dragStart(e){

    isDragging = true;

    isSwipeGesture = false;

    startX = getPositionX(e);

    animationID = requestAnimationFrame(animation);

    sliderTrack.style.transition = "none";

}


function dragMove(e){

    if(!isDragging) return;

    currentX = getPositionX(e);

    const diff = currentX - startX;

    currentTranslate = previousTranslate + diff;

    if (Math.abs(diff) > 12) {
      isSwipeGesture = true;
    }
}



function dragEnd(){

    if(!isDragging) return;

    cancelAnimationFrame(animationID);

    isDragging = false;

    const movedBy = currentTranslate - previousTranslate;

    if(movedBy < -100){

        currentPage++;

    }

    if(movedBy > 100){

        currentPage--;

    }

    if(currentPage < 0){

        currentPage = totalPages - 1;

    }

    if(currentPage >= totalPages){

        currentPage = 0;

    }

    updateSlider(true);
    setTimeout(() => {

        isSwipeGesture = false;

    }, 100);
    scrollToRestaurantTop();

}


function getPositionX(e){

    return e.type.includes("mouse")
        ? e.pageX
        : e.touches[0].clientX;

}



// ==============================
// Mouse
// ==============================

sliderTrack.addEventListener("mousedown",dragStart);

window.addEventListener("mousemove",dragMove);

window.addEventListener("mouseup",dragEnd);



// ==============================
// Touch
// ==============================

sliderTrack.addEventListener("touchstart",dragStart,{
    passive:true
});

sliderTrack.addEventListener("touchmove",dragMove,{
    passive:true
});

sliderTrack.addEventListener("touchend",dragEnd);

sliderTrack.addEventListener("touchcancel",dragEnd);



// ==============================
// Prevent Image Drag
// ==============================

sliderTrack.addEventListener("dragstart",(e)=>{

    e.preventDefault();

});



// ==============================
// Keyboard
// ==============================

document.addEventListener("keydown",(e)=>{

    if(e.key==="ArrowLeft"){

        movePage(-1);

    }

    if(e.key==="ArrowRight"){

        movePage(1);

    }

});

// ==============================
// Open Restaurant From URL
// ==============================

function openRestaurantFromUrl(){

    const params = new URLSearchParams(window.location.search);
    const target = params.get("restaurant");

    if(!target) return false;

    const sortedRestaurants = [...restaurants].sort(
        (a, b) => new Date(b.date) - new Date(a.date)
    );

   const restaurantIndex = sortedRestaurants.findIndex(
    restaurant => restaurant.id === target
   );

    if(restaurantIndex === -1) return false;

    currentPage = Math.floor(restaurantIndex / perPage);

    updateSlider(false);

    return true;
}
// ==============================
// Init
// ==============================

buildSlider();

if(!openRestaurantFromUrl()){
    updateSlider(false);
}

</script>
