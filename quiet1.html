<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Quiet Pages | Space for Being</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Caveat:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Cormorant Garamond', serif;
  color:#25221d;

  background:
    linear-gradient(
      rgba(122,111,94,.16),
      rgba(122,111,94,.16)
    ),
    #b8ad9d;

  min-height:100vh;
}


/* =========================
   HOME
========================= */

.back-home{
  position:fixed;
  top:20px;
  left:28px;

  z-index:100;

  color:#2e2923;
  font-family:'Inter',sans-serif;
  font-size:9px;

  letter-spacing:2px;
  text-decoration:none;
}


/* =========================
   BOOK
========================= */

.quiet-book{
  width:min(1450px,94vw);
  margin:55px auto 50px;

  background:#e9e4db;

  box-shadow:
    0 30px 80px rgba(25,20,15,.28);

  position:relative;

  overflow:hidden;
}


/* subtle paper grain */

.quiet-book::after{
  content:"";
  position:absolute;
  inset:0;

  pointer-events:none;

  opacity:.12;

  background-image:
    repeating-radial-gradient(
      circle at 0 0,
      rgba(40,30,20,.15) 0,
      transparent 1px,
      transparent 3px
    );
}


/* =========================
   HERO
========================= */

.quiet-hero{
  display:grid;

  grid-template-columns:
    180px 1fr 220px;

  align-items:center;

  min-height:180px;
  padding:28px 55px 22px;

  border-bottom:
    1px solid rgba(35,30,25,.7);

  position:relative;

  z-index:2;
}


.hero-meta{
  font-family:'Inter',sans-serif;

  display:flex;
  flex-direction:column;

  gap:6px;

  font-size:8px;
  letter-spacing:1.4px;
}


.hero-title{
  text-align:center;
}


.hero-title h1{
  font-family:'Cormorant Garamond',serif;
  font-size:48px;
  font-weight:600;
  line-height:.82;
  letter-spacing:13px;
}


.hero-title p{
  margin-top:18px;
  font-size:10px;
  letter-spacing:7px;
}


.hero-quote{
  font-size:13px;
  line-height:1.5;
  text-align:right;
}


/* =========================
   MAGAZINE
========================= */

.magazine{
  display:flex;
  align-items:center;
  position:relative;
}


.magazine-window{
  width:100%;
  overflow:hidden;
}


.magazine-track{
  display:flex;
  width:100%;
  transition:
    transform .6s
    cubic-bezier(.22,.61,.36,1);
  touch-action:pan-y;
}


/* ONE SPREAD */

.magazine-spread{
  width:100%;
  flex:0 0 100%;

  min-height:650px;

  display:grid;
  grid-template-columns:1fr 1fr;

  position:relative;
}

/* center fold */

.magazine-spread::after{
  content:"";

  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:1px;
  background:
    rgba(88,74,56,.16);

  box-shadow:
    0 0 18px rgba(60,45,30,.12);
}


/* =========================
   LEFT / RIGHT PAGE
========================= */

.magazine-page{
  padding:28px 40px 34px;

  position:relative;
}


.magazine-page.left{
  border-right:
    1px solid rgba(70,60,50,.06);
}

/* =========================
   EDITORIAL GRID
========================= */

.editorial-grid{
    display:grid;

    grid-template-columns:repeat(12, 1fr);
    grid-template-rows:auto auto;

    column-gap:18px;
    row-gap:26px;
    align-content:start;

    
}


/* =========================
   LEFT PAGE
   3 ARTICLES + INDEX
========================= */

.left-grid .article-1.long-wrapper{
    grid-column:1 / 7;
    grid-row:1;
}

.left-grid .article-2.short-wrapper{
    grid-column:7/ 13;
    grid-row:1;
}

.left-grid .issue-index{
    grid-column:1 / 6;
    grid-row:2;
    align-self:start;
}

.left-grid .article-3{
    grid-column:6/ 13;/* 넓게 */
    grid-row:2;
}

/* =========================
   RIGHT PAGE
   4 ARTICLES
========================= */

.right-grid .article-1.long-wrapper{
    grid-column:1 / 7;
    grid-row:1;
}

.right-grid .article-2.short-wrapper{
    grid-column:7 / 13;
    grid-row:1;
}

.right-grid .article-3{
    grid-column:8 / 13;
    grid-row:2;
}

.right-grid .article-4{
    grid-column:1 / 8;
    grid-row:2;
}

/* wrapper 안의 article이 공간을 꽉 채우게 */

.editorial-grid > div > .magazine-article{
    height:auto;
}

.editorial-grid > div > .magazine-article.short-post{
    height:auto;
    overflow:visible;
}


/* =========================
   ARTICLE
========================= */

.magazine-article{
  min-width:0;
  height:auto;
  padding-top:10px;
  padding-bottom:12px;
  border-top:1px solid rgba(42,36,30,.35);
  cursor:pointer;
  overflow:hidden;
  transition:.25s;
}

.magazine-article:hover{
  transform:translateY(-2px);
}


.article-number{
  font-family:'Inter',sans-serif;
  font-size:8px;
  letter-spacing:2px;
  margin-bottom:7px;
  color:#7a6c5b;
}


.magazine-article h2{
  font-size:17px;
  font-weight:600;
  line-height:1.05;
  margin-bottom:6px;
}

.article-1 .magazine-article h2{
  font-size:17px;
}

.article-korean{
  font-size:14px;
  font-style:italic;
  color:#776e64;
  margin-bottom:10px;
}

.article-date{
  font-family:'Inter',sans-serif;
  font-size:8px;
  letter-spacing:1px;
  color:#8e806f;
  margin-bottom:16px;
}


/* =========================
   ARTICLE TEXT
========================= */

.article-excerpt{
    font-family:'Inter', sans-serif;

    font-size:13px;
    line-height:1.9;

    color:#373128;
    text-align:justify;
    text-justify:inter-character;
    word-break:keep-all;

    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:10;

    overflow:hidden;
}

/* 긴 글의 위치별 노출 줄 수 */

.article-1 .long-post .article-excerpt{
    -webkit-line-clamp:10;
}

.article-2 .long-post .article-excerpt{
    -webkit-line-clamp:8;
}

.article-3 .long-post .article-excerpt{
    -webkit-line-clamp:8;
}

.article-4 .long-post .article-excerpt{
    -webkit-line-clamp:10;
}


/* =========================
   SHORT POST
   짧은 글은 전부 표시
========================= */

.short-post{
    height:auto;
    overflow:visible;
}

.short-post .article-excerpt{
    display:block;
    overflow:visible;

    -webkit-line-clamp:unset;
    -webkit-box-orient:initial;
}

/* =========================
   LONG POST
========================= */

.long-post{
    overflow:hidden;
}

.long-post .article-excerpt{
    display:-webkit-box;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

/* 이미지 없는 긴 글 */
.long-post .article-excerpt{
    -webkit-line-clamp:10;
}

/* 이미지 있는 긴 글 */
.long-post.has-image .article-excerpt{
    -webkit-line-clamp:5;
}

/* 반드시 위 규칙들보다 아래 */
.custom-excerpt .article-excerpt{
    display:block;
    overflow:visible;
    -webkit-line-clamp:unset;
}

/* =========================
   SMALL PHOTO
========================= */

/* 큰 기사 */
.article-1 .article-photo{
    width:100%;
    height:130px;
}

/* 작은 기사 */
.article-2 .article-photo{
    width:100%;
    height:120px;
    object-fit:cover;
}

.article-3 .article-photo{
    width:270px;
    height:130px;
    object-fit:cover;
}

.article-4 .article-photo{
   width:100%;
   height:120px;
   object-fit:contain;
}

/* =========================
   READ MORE
========================= */

.read-more{
  display:inline-block;
  margin-top:10px;
  font-family:'Inter',sans-serif;
  font-size:7px;
  text-transform:uppercase;
  letter-spacing:1.8px;
  border-bottom:
    1px solid #34302b;

  padding-bottom:3px;
}


/* =========================
   INDEX
========================= */

.issue-index{
    width:100%;
    border-top:1px solid rgba(42,36,30,.35);
    padding-top:10px;
    overflow:hidden;
}

.issue-index h3{
    font-size:16px;
    font-weight:600;
    margin-bottom:8px;
}

.issue-index a{
    display:grid;
    grid-template-columns:18px 1fr;
    gap:5px;
    color:#302b25;
    text-decoration:none;
    font-size:11px;
    line-height:1.35;
    padding:1px 0;
}


/* =========================
   PAGE BUTTON
========================= */

.page-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:45px;
  height:70px;
  z-index:20;
  background:transparent;
  border:none;
  font-family:'Cormorant Garamond',serif;
  font-size:48px;
  color:#625747;
  cursor:pointer;
  opacity:.5;
}


.page-btn:hover{
  opacity:1;
}


.page-btn.prev{
  left:3px;
}


.page-btn.next{
  right:3px;
}


/* =========================
   PAGE COUNT
========================= */

.page-count{
  text-align:center;
  padding:18px 0 23px;
  border-top:
    1px solid rgba(45,40,35,.22);

  font-family:'Inter',sans-serif;
  font-size:8px;
  letter-spacing:3px;
  color:#706657;
}


/* =========================
   FULL ARTICLE READER
========================= */

.article-reader{
  position:fixed;

  inset:0;

  background:
    rgba(29,25,20,.75);

  display:none;

  align-items:center;
  justify-content:center;
  z-index:500;
  padding:30px;
}


.article-reader.open{
  display:flex;
}


.reader-paper{
  width:min(820px,92vw);
  max-height:90vh;
  overflow-y:auto;
  background:#eee5d6;
  padding:65px 75px;
  box-shadow:
    0 30px 90px rgba(0,0,0,.35);

  position:relative;
}


.reader-close{
  position:absolute;
  right:25px;
  top:15px;
  border:none;
  background:none;
  font-size:30px;
  cursor:pointer;
  color:#554b3e;
}

.reader-date{
  font-family:'Inter',sans-serif;
  font-size:9px;
  letter-spacing:3px;
  color:#8a7b68;
  margin-bottom:15px;
}


.reader-paper h2{
  font-size:38px;
  line-height:1;
  margin-bottom:8px;
}


.reader-korean{
  font-size:15px;
  color:#807362;
  font-style:italic;
}


.reader-line{
  width:60px;
  height:1px;
  background:#8b806f;
  margin:24px 0;
}


.reader-body p{
    margin:0 0 18px;
    line-height:1.8;
    word-break:keep-all;
}

.reader-body p:last-child{
    margin-bottom:0;
}


/* =========================
   FOOTER
========================= */

footer{
  font-family:'Inter',sans-serif;
  font-size:9px;
  text-align:center;
  padding:25px;
  color:#756c61;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .back-home{
    position:static;

    display:block;

    width:92%;

    margin:14px auto;
  }


  .quiet-book{
    width:96%;

    margin:15px auto 30px;
  }


  .quiet-hero{
    display:block;
    min-height:auto;
    padding:22px 20px;
    text-align:center;
  }


  .hero-meta{
    flex-direction:row;
    justify-content:space-between;
    margin-bottom:12px;
  }


  .hero-title h1{
    font-size:24px;
    letter-spacing:5px;
  }


  .hero-title p{
    font-size:7px;
    letter-spacing:3px;
    margin-top:10px;
  }


  .hero-quote{
    display:none;
  }


  .magazine-spread{
    grid-template-columns:1fr;

    min-height:auto;
  }


  .magazine-spread::after{
    display:none;
  }


  .magazine-page{
    padding:24px 25px;
  }


  /*
   On mobile:
   left page only.
   right page follows below.
  */

  .article-grid{
    grid-template-columns:1fr;
    gap:28px;
  }


  .magazine-page.right .article-grid{
    grid-template-areas:
      "a"
      "b"
      "c"
      "index";
  }


  .article-excerpt{
    -webkit-line-clamp:8;

    font-size:12px;

    line-height:1.55;
  }


  .magazine-article h2{
    font-size:16px;
  }


  .issue-index{
    margin-top:10px;
  }


  .page-btn{
    width:15px;
    font-size:20px;
  }


  .reader-paper{
    padding:45px 28px;
  }


  .reader-paper h2{
    font-size:20px;
  }


  .reader-body{
    font-size:12px;
  }

}
</style>

// ==============================
// QUIET MAGAZINE
// ==============================

const notesPerSpread = 7;

let currentPage = 0;

const track =
    document.getElementById("magazine-track");


// ==============================
// CLEAN BODY TEXT
// ==============================

function cleanText(html){

    const temp =
        document.createElement("div");

    temp.innerHTML = html;

    return temp.textContent
        .replace(/\s+/g," ")
        .trim();

}


// ==============================
// ARTICLE HTML
// ==============================

function createArticle(note,index){

    const excerpt =
        note.excerpt || cleanText(note.body);

    return `

    <article
        class="magazine-article
         ${note.longPost ? "long-post" : "short-post"}
         ${note.image ? "has-image" : ""}
         ${note.excerpt ? "custom-excerpt" : ""}"
         ${note.longPost ? `onclick="openArticle(${index})"` : ""}>

        <div class="article-number">
            NOTE ${String(index + 1).padStart(2,"0")}
        </div>


        <h2>
            ${note.title}
        </h2>

        ${
          note.korean
          ? `<div class="article-korean">
               ${note.korean}
             </div>`
          : ""
        }
        
        ${note.image
          ? `<img
             src="${note.image}"
             class="article-photo"
             alt="${note.title}">
            `
          : ""
      }

        <div class="article-excerpt">
            ${excerpt}
        </div>
        ${
           note.longPost
           ? `<span class="read-more">
                Read full note
              </span>`
           : ""
          }

    </article>

    `;

}


// ==============================
// INDEX
// ==============================

function createIndex(){

    let html = `

      <aside class="issue-index">

        <h3>In This Issue</h3>

    `;


    notes.forEach((note,index)=>{

        const page =
            Math.floor(index / notesPerSpread);

        html += `

        <a href="#"
           onclick="
             goToPage(${page});
             return false;
           ">

           <span>
             ${String(index + 1)
               .padStart(2,"0")}
           </span>

           <span>
             ${note.title}
           </span>

        </a>

        `;

    });


    html += `</aside>`;

    return html;

}


// ==============================
// BUILD MAGAZINE
// ==============================

function buildMagazine(){

    track.innerHTML = "";

    const totalPages =
        Math.ceil(notes.length / notesPerSpread);


    for(let page = 0; page < totalPages; page++){

        const start =
            page * notesPerSpread;

        const items =
            notes.slice(
                start,
                start + notesPerSpread
            );


        const spread =
            document.createElement("section");

        spread.className =
            "magazine-spread";


        // =========================
        // LEFT PAGE
        // 3 articles + index
        // =========================

        const left =
            document.createElement("div");

        left.className =
            "magazine-page left";


        const leftGrid =
            document.createElement("div");

        leftGrid.className =
            "editorial-grid left-grid";


        for(let i = 0; i < 3; i++){

            if(!items[i]) continue;

            const wrapper =
                document.createElement("div");

            wrapper.className =
               `article-${i + 1} ${items[i].longPost ? "long-wrapper" : "short-wrapper"}`;

            wrapper.innerHTML =
                createArticle(
                    items[i],
                    start + i
                );

            leftGrid.appendChild(wrapper);
        }


        // INDEX = 네 번째 편집 블록
        leftGrid.insertAdjacentHTML(
            "beforeend",
            createIndex()
        );


        left.appendChild(leftGrid);



        // =========================
        // RIGHT PAGE
        // 4 articles
        // =========================

        const right =
            document.createElement("div");

        right.className =
            "magazine-page right";


        const rightGrid =
            document.createElement("div");

        rightGrid.className =
            "editorial-grid right-grid";


        for(let i = 3; i < 7; i++){

            if(!items[i]) continue;

            const wrapper =
                document.createElement("div");

            wrapper.className =
               `article-${i - 2} ${items[i].longPost ? "long-wrapper" : "short-wrapper"}`;

            wrapper.innerHTML =
                createArticle(
                    items[i],
                    start + i
                );

            rightGrid.appendChild(wrapper);
        }


        right.appendChild(rightGrid);

        spread.appendChild(left);
        spread.appendChild(right);
  
        track.appendChild(spread);
      }
}
 

// ==============================
// UPDATE PAGE
// ==============================

function updateSlider(animate = true){

    const totalPages =
        Math.ceil(
            notes.length /
            notesPerSpread
        );


    if(animate){

        track.style.transition =
            "transform .6s cubic-bezier(.22,.61,.36,1)";

    }else{

        track.style.transition =
            "none";

    }


    track.style.transform =
        `translateX(-${currentPage * 100}%)`;


    document.getElementById(
        "page-count"
    ).textContent =
        `${currentPage + 1} / ${totalPages}`;

}


// ==============================
// NEXT / PREVIOUS
// ==============================

function changePage(step){

    const totalPages =
        Math.ceil(
            notes.length /
            notesPerSpread
        );


    currentPage += step;


    if(currentPage < 0){

        currentPage =
            totalPages - 1;

    }


    if(currentPage >= totalPages){

        currentPage = 0;

    }


    updateSlider(true);

}


// ==============================
// INDEX
// ==============================

function goToPage(page){

    currentPage = page;

    updateSlider(true);

}


// ==============================
// FULL ARTICLE
// ==============================

function openArticle(index){

    const note = notes[index];


    document.getElementById(
        "reader-date"
    ).textContent =
        note.date || "";


    document.getElementById(
        "reader-title"
    ).textContent =
        note.title;


    document.getElementById(
        "reader-korean"
    ).textContent =
        note.korean || "";


    document.getElementById(
        "reader-body"
    ).innerHTML =
        note.body;


    document.getElementById(
        "article-reader"
    ).classList.add("open");


    document.body.style.overflow =
        "hidden";

}


function closeArticle(){

    document.getElementById(
        "article-reader"
    ).classList.remove("open");

    document.body.style.overflow =
        "";

}


// ESC

document.addEventListener(
    "keydown",
    e => {

        if(e.key === "Escape"){

            closeArticle();

        }

    }
);


// ==============================
// URL DATE
// ==============================

const params =
    new URLSearchParams(
        window.location.search
    );

const targetDate =
    params.get("date");


if(targetDate){

    const index =
        notes.findIndex(
            note =>
                note.date === targetDate
        );


    if(index !== -1){

        currentPage =
            Math.floor(
                index /
                notesPerSpread
            );

    }

}


// ==============================
// DRAG & SWIPE
// ==============================

let startX = 0;
let dragging = false;


track.addEventListener(
    "pointerdown",
    e => {

        startX =
            e.clientX;

        dragging = true;

        track.setPointerCapture(
            e.pointerId
        );

    }
);


track.addEventListener(
    "pointerup",
    e => {

        if(!dragging) return;

        dragging = false;


        const diff =
            e.clientX - startX;


        if(diff < -80){

            changePage(1);

        }


        if(diff > 80){

            changePage(-1);

        }

    }
);


// ==============================
// INITIALIZE
// ==============================

buildMagazine();

updateSlider(false);
    
</script>
