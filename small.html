<title>Small Wonders</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#f6f5f2;
  font-family:'Montserrat', sans-serif;
  color:#2d3e52;
}

a{
  text-decoration:none;
  color:inherit;
}

.back-wrap{
  width:min(1120px,90%);
  margin:28px auto 0;
}

.back-link{
  font-size:11px;
  letter-spacing:1.0px;
  text-transform:uppercase;
  color:#232831;
}


/* HERO */
.hero{
  width:100%;
  height:30vh;
  background-image:url("Images/small/dailybanner.png");
  background-size:cover;
  background-position:center;
  border-bottom-left-radius:12px;
  border-bottom-right-radius:12px;
  display:none;
}

/* INTRO */

.back-link{
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:#232831;
  transition:0.3s;
  margin-left:60px ;
}

.back-link:hover{
  color:#31476E;
}

.intro{
  text-align:center;
  padding:24px 10px 34px;
}

.intro h1{
  font-family:'Cormorant Garamond', serif;
  font-size:26px;
  font-weight:600;
  color:#31476E;
  letter-spacing:4px;
  margin-bottom:6px;
}

.intro p{
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#7d8896;
}

/* MAIN */
.main-layout{
  width:min(1180px,92%);
  margin:0 auto 40px;
  display:grid;
  grid-template-columns:1.15fr 0.85fr;
  gap:24px;
  align-items:start;
}

/* LEFT POST */
.post-area{
  background:rgba(255,255,255,0.64);
  border-radius:28px;
  padding:50px;
  border:1px solid rgba(255,255,255,0.7);
  box-shadow:0 14px 35px rgba(0,0,0,0.05);
}

.slider{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:16px;
  margin-bottom:18px;
}

.slide-track{
  display:flex;
  transition:transform 0.5s ease;
}

.slide{
  min-width:100%;
}

.slide img{
  width:100%;
  height:400px;
  object-fit:cover;
  display:block;
  border-radius:16px;
}

.slide-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:36px;
  height:36px;
  border:none;
  border-radius:50%;
  background:transparent;
  color:rgb(30, 30, 32);
  cursor:pointer;
  font-size:22px;
  box-shadow:0 6px 18px;
}

.prev{ left:14px; }
.next{ right:14px; }

.dots{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:14px 0 34px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#b8c0ca;
  cursor:pointer;
}

.dot.active{
  background:#31476E;
}

.post-meta{
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#8a96a5;
  margin-bottom:20px;
}

.post-title{
  font-family:'Cormorant Garamond', serif;
  font-size:16px;
  font-weight:500;
  color:#243d68;
  margin-bottom:10px;
}

.post-body p{
  font-size:13px;
  line-height:1.6;
  color:#354a68;
  margin-bottom:10px;
}

/* RIGHT CARDS */
.side-area{
  display:flex;
  flex-direction:column;
  gap:24px;
}

.side-card{
  background:rgba(255,255,255,0.68);
  border-radius:18px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.75);
  box-shadow:0 12px 30px rgba(0,0,0,0.06);
  cursor:pointer;
  transition:0.3s ease;
}

.side-card:hover{
  transform:translateY(-5px);
  box-shadow:0 18px 38px rgba(0,0,0,0.1);
}

.side-card img{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
}

.side-content{
  padding:18px;
}

.side-content span{
  display:block;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#9aa4af;
  margin-bottom:2px;
}

.side-content h3{
  font-family:'Cormorant Garamond', serif;
  font-size:18px;
  color:#181c24;
  margin-bottom:4px;
}

.read-more{
  display:inline-block;
  margin-top:10px;

  font-size:10px;
  letter-spacing:1.4px;
  text-transform:uppercase;

  color:#31476E;
  border-bottom:1px solid #31476E;
  padding-bottom:2px;
}

/* PHOTO INDEX */

.index-section{
  width:min(1180px,92%);
  margin:0 auto 90px;

  background:rgba(255,255,255,0.62);
  border-radius:26px;
  padding:30px;

  border:1px solid rgba(255,255,255,0.7);
  box-shadow:0 14px 35px rgba(0,0,0,0.05);
}

.index-title{
  font-family:'Cormorant Garamond', serif;
  font-size:18px;
  font-weight:600;
  color:#202837;
  margin-bottom:14px;
}

.archive-nav{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  margin-top:30px;
}

.archive-nav button{
  border:none;
  background:none;
  font-size:12px;
  cursor:pointer;
  color:#5d6b82;
  transition:0.3s;
}

.archive-nav button:hover{
  transform:translateY(-2px);
  color:#2f3b4a;
}

#page-number{
  font-size:11px;
  letter-spacing:2px;
  color:#8c95a5;
}


.index-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:0 40px;
}


.archive-item{
    display:flex;
    align-items:center;
    gap:16px;
 
    padding:12px 0;

    border-bottom:1px solid rgba(49,71,110,0.1);
 
}

.archive-item span{
  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#9aa4af;
  white-space:nowrap;
}

.archive-left{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}

.archive-thumb{
  width:55px;
  height:40px;

  object-fit:cover;

  border-radius:8px;

  flex-shrink:0;
}

.archive-item h3{
  font-family:'Cormorant Garamond', serif;
  font-size:14px;
  font-weight:600;
  color:#31476E;
}


/* RESPONSIVE */
@media(max-width:900px){

  .main-layout{
    grid-template-columns:1fr;
  }

  .post-area,
  .side-area,
  .index-section{
    width:92%;
    margin-left:auto;
    margin-right:auto;
  }

  .slide img{
    height:230px;
  }

  .index-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:650px){

  body{
    overflow-x:hidden;
  }

  .hero{
    height:130px;
    background-size:contain;
    background-position:center top;
    background-repeat:no-repeat;
  }

  .back-wrap{
    width:100%;
    margin:0 auto;
  }

  .back-link{

    letter-spacing:1.2px;
  }

    width:100%;
    padding:8px 10px 14px;

  }

    font-size:17px;

  }

   display:block;
  }

  .post-subtitle,
  .post-body{
    width:100%;
    margin-left:0;
    margin-right:0;
    padding:0;
    box-sizing:border-box;
  }

   font-size:9px;
   letter-spacing:3px;
   margin-top:22px;
   margin-bottom:14px;
  }

 .post-title{
   font-size:17px;
   line-height:1.35;
   margin-bottom:6px;
  }

 .post-subtitle{
   font-size:11px;
   line-height:1.5;
   margin-bottom:10px;
  }

 .post-body p{
   width:100%;
   font-size:11px;
   line-height:1.65;
   margin:0 0 8px 0;
   padding:0;
  }

 /* 아래 카드들 */
 .index-section{
   width:92%;
   max-width:none;
   margin:0 auto 50px;
   padding:0;
   background:transparent;
   box-shadow:none;
   border:none;
  }

 .index-grid{
   grid-template-columns:1fr;
   gap:14px;
  }

 .index-card,
 .place-card,
 .food-card{
   width:100%;
   margin:0 auto;
  }

 .index-card img,
 .place-card img,
 .food-card img{
   width:100%;
   display:block;
   object-fit:cover;
  }
}
</style>

</section>

posts.sort((a, b) => new Date(b.date) - new Date(a.date));

let currentPost = 0;
let currentSlide = 0;

let currentPage = 1;
const postsPerPage = 10;

const slideTrack = document.getElementById("slideTrack");
const dotsWrap = document.getElementById("dots");

function showPost(index){
  currentPost = index;
  currentSlide = 0;

  const post = posts[index];

  document.getElementById("postDate").innerText =
    post.displayDate || post.date;

  document.getElementById("postTitle").innerText = post.title;
  document.getElementById("postBody").innerHTML = post.body;

  renderSlides(post.images);
  renderIndex();
  updateSlide();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function renderSlides(images){
  slideTrack.innerHTML = "";
  dotsWrap.innerHTML = "";

  images.forEach((image, index) => {
    slideTrack.innerHTML += `
      <div class="slide">
        <img src="${image}" alt="" loading="lazy">
      </div>
    `;

    dotsWrap.innerHTML += `
      <span class="dot" onclick="goSlide(${index})"></span>
    `;
  });
}

function updateSlide(){
  const dots = document.querySelectorAll(".dot");

  slideTrack.style.transform =
    `translateX(-${currentSlide * 100}%)`;

  dots.forEach(dot => dot.classList.remove("active"));

  if(dots[currentSlide]){
    dots[currentSlide].classList.add("active");
  }
}

function moveSlide(step){
  const totalSlides = posts[currentPost].images.length;

  currentSlide += step;

  if(currentSlide < 0){
    currentSlide = totalSlides - 1;
  }

  if(currentSlide >= totalSlides){
    currentSlide = 0;
  }

  updateSlide();
}

function goSlide(index){
  currentSlide = index;
  updateSlide();
}

function renderIndex(){
  const leftColumn = document.getElementById("left-column");
  const rightColumn = document.getElementById("right-column");

  leftColumn.innerHTML = "";
  rightColumn.innerHTML = "";

  const start = (currentPage - 1) * postsPerPage;
  const end = start + postsPerPage;

  const visiblePosts = posts.slice(start, end);

  visiblePosts.forEach((post, i) => {
    const realIndex = start + i;

    const item = `
      <div class="archive-item" onclick="showPost(${realIndex})">

        <div class="archive-left">
          <img src="${post.images[0]}"
               alt="${post.title}"
               class="archive-thumb">

          <h3>${post.title}</h3>
        </div>

        <span>${post.displayDate || post.date}</span>

      </div>
    `;

    if(i < 5){
      leftColumn.innerHTML += item;
    } else {
      rightColumn.innerHTML += item;
    }
  });
}

function nextIndexPage(){
  const maxPage = Math.ceil(posts.length / postsPerPage);

  if(currentPage < maxPage){
    currentPage++;
    renderIndex();
  }
}

function prevIndexPage(){
  if(currentPage > 1){
    currentPage--;
    renderIndex();
  }
}

renderIndex();
showPost(0);
</script>
