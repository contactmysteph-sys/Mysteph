a{

img{

/* BACK */

.back-home{

/* INTRO */

.intro{
  width:min(900px,90%);
  margin:28px auto 18px;
  text-align:center;
}

.intro span{
  font-family:'Caveat', cursive;
  font-size:25px;
  letter-spacing:2.5px;

}

.intro h1{

}

/* MAIN SECTION */

.detail-section{
  width:min(1200px,90%);
  margin:0 auto 90px;
  background:rgba(255,255,255,0.78);
  border:1px solid rgba(49,71,110,0.14);
  box-shadow:0 18px 50px rgba(49,71,110,0.08);
  padding:42px;
}

.detail-top span{
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#8a94a3;
}

.detail-top h2{
  margin:8px 0 16px;
  font-family:'Cormorant Garamond', serif;
  font-size:24px;
  color:#31476E;
}

.detail-top p{
  max-width:760px;
  font-size:13px;
  line-height:1.6;
  color:#566171;
}

/* CITY BUTTONS */

.place-list{
  margin:20px 0;
  display:grid;
  flex-wrap:wrap;
  gap:7px;
  grid-template-columns:repeat(auto-fit, minmax(95px, 1fr));
}

.place-list button{
  width:100%;
  height:32px;
  padding:0;
  background:rgba(238,243,247,0.9);
  border:1px solid rgba(49,71,110,0.12);
  font-size:10px;
  letter-spacing:1px;
  color:#46566b;
  cursor:pointer;
}

.place-list button.active{
  background:#31476E;
  color:white;
  border-color:#31476E;
}

/* PHOTO GRID */

.photo-grid{
  margin-top:34px;
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:14px;
}

.photo-grid img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:4px;
}

/* NOTE */

.note{
  max-width:800px;
  margin-top:40px;
  padding-top:30px;
  border-top:1px solid rgba(49,71,110,.15);
  font-size:14px;
  line-height:2;
  color:#566171;
  white-space:pre-line;
}

/* MOBILE */

@media(max-width:650px){

  body{
    background-attachment:scroll;
  }

  .back-home{
    font-size:8px;
    letter-spacing:1px;

  .intro{

  .note{

    line-height:1.5;
    letter-spacing:0.5px;
  }
}
</style>

function renderCityButtons(){
  const cityList = document.getElementById("city-list");

  const publishedCities = cities.filter(city => city.published);
  cityList.innerHTML = cities
    .map((city, index) => {

       if (!city.published) return "";

       return `
         <button
           class="${index === 0 ? "active" : ""}"
           onclick="showCity(${index}, this)">
           ${city.name}
         </button>
      `;
    })
    .join("");
}

renderCityButtons();

function showCity(index, button){
  const city = cities[index];

  document.getElementById("city-title").innerText = city.name;
  document.getElementById("city-desc").innerText = city.desc;
  document.getElementById("city-note").innerText = city.note;

  document.getElementById("photo-grid").innerHTML =
    city.images.map(img => `
      <img src="${img}" alt="${city.name}" loading="lazy" decoding="async">
    `).join("");

  document.querySelectorAll("#city-list button").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");
}

const hash = window.location.hash.substring(1);

const cityIndex = cities.findIndex(
  city => city.id === hash
);

if (cityIndex >= 0) {

  const button =
    document.querySelectorAll("#city-list button")[cityIndex];

  showCity(cityIndex, button);

} else {

  showCity(
    0,
    document.querySelector("#city-list button")
  );

}
