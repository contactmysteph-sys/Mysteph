/*==============================
MAP
==============================*/

.map-section{

    width:min(1700px, 92vw);
    margin:0 auto;
    text-align:center;
}

.map-wrapper{

    position:relative;
    display:inline-block;

    width:90%;
    max-width:1500px;
    padding:0;
    border-radius:32px;
    background:rgba(255,255,255,.26);
    overflow:hidden;

}

.japan-map {

    width: 100%;
    display: block;

    filter: drop-shadow(
        0 18px 35px rgba(49,71,110,.10)
    );
}

.map-wrapper::before{

    content:"";
    position:absolute;
    inset:18px;
    border-radius:24px;
    border:1px solid rgba(255,255,255,.45);
    pointer-events:none;
    display:block;
}

.map-popup{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%, -50%);
    width:200px;
    background:
        linear-gradient(
        rgba(202, 216, 246, 0.88),
        rgba(227, 231, 243, 0.9)
        );

    border-radius:10px;
    overflow:hidden;
    box-shadow:0 10px 20px rgba(0,0,0,.18);
    display:none;
    z-index:20;
}

.map-popup img{

    width:100%;
    height:120px;
    object-fit:cover;
}

.map-popup h3{

    margin:10px 0 4px;
    font-size:14px;
    letter-spacing: 4px;
}

.map-popup a{

    display:block;
    padding:0 0 10px;
    font-size:11px;
    color:#242d39;
    text-decoration:none;
}

/* ==========================
   COMPASS
========================== */

.compass{

    position:absolute;

    top:25px;
    left:25px;

    z-index:20;
    transform:scale(1.2);
    text-align:center;
}

.compass-circle{

    width:80px;
    height:80px;
    border-radius:50%;
    border:1px solid rgba(49,71,110,.25);
    position:relative;
    background:rgba(255,255,255,.45);
    animation:spinCompass 28s linear infinite;
}

.compass p{
    margin-top:4px;
    font: size 11px;
    letter-spacing:6px;
    font-style:italic;
}

.north,
.south,
.east,
.west{

    position:absolute;
    font-size:10px;
    color:#6d7887;
}

.north{

    top:10px;
    left:50%;
    transform:translateX(-50%);
}

.south{

    bottom:10px;
    left:50%;
    transform:translateX(-50%);
}

.east{

    right:10px;
    top:50%;
    transform:translateY(-50%);
}

.west{

    left:10px;
    top:50%;
    transform:translateY(-50%);
}

.compass-star{

    position:absolute;

    top:50%;
    left:50%;

    width:60px;
    height:60px;

    transform:translate(-50%, -50%);
}

/* 북쪽 */

.north-needle{

    position:absolute;

    left:50%;
    top:0;

    width:0;
    height:0;

    transform:translateX(-50%);

    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-bottom:34px solid #31476E;
}

/* 남쪽 */

.south-needle{

    position:absolute;

    left:50%;
    bottom:0;

    width:0;
    height:0;

    transform:translateX(-50%);

    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-top:26px solid rgba(49,71,110,.5);
}

/* 동쪽 */

.east-needle{

    position:absolute;

    top:50%;
    right:0;

    width:0;
    height:0;

    transform:translateY(-50%);

    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
    border-left:24px solid rgba(49,71,110,.7);
}

/* 서쪽 */

.west-needle{

    position:absolute;

    top:50%;
    left:0;

    width:0;
    height:0;

    transform:translateY(-50%);

    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
    border-right:24px solid rgba(49,71,110,.7);
}

@keyframes spinCompass{

    from{

        transform:rotate(0deg);
    }

    to{

        transform:rotate(360deg);
    }
}

/*==============================
CITY LINK
==============================*/

.city{

    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    width:9px;
    height:9px;
    border-radius:50%;
    text-decoration:none;
    transition:.25s;
    transform: translate(-50%, -50%);
}

.city::before{

    content:"";

    width:9px;
    height:9px;

    background:#3a4455;
    border-radius:50% 50% 50% 0;

    transform:rotate(-45deg);
}

.city:hover::before{

    transform: scale(1.8);
    background:#87A2C6;
}


.city::after {

    content: attr(data-name);

    position: absolute;

    top: -18px;
    left: 50%;

    transform: translateX(-50%);

    color: #101b29;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;

    opacity: 0;
    transition: .25s;
    pointer-events: none;
}

.city:hover::after{

    opacity: 1;

    top: -28px;

    transform: translateX(-50%) scale(1.05);
}

<script>
const popup = document.getElementById("popup");

const popupImg = document.getElementById("popup-img");
const popupTitle = document.getElementById("popup-title");
let currentLink = "";

document.querySelectorAll(".city").forEach(city => {

    city.addEventListener("mouseenter", (e) => {

      popupImg.src = city.dataset.image;

      popupTitle.textContent = city.dataset.title;

      currentLink = city.dataset.link;

      popup.style.left = `${e.target.offsetLeft + 30}px`;

      if (
          city.classList.contains("sapporo") ||
          city.classList.contains("furano") ||
          city.classList.contains("otaru") ||
          city.classList.contains("abashiri")
        ) {

          popup.style.top = `${e.target.offsetTop + 30}px`;

        } else {

          popup.style.top = `${e.target.offsetTop - 120}px`;

        }

        popup.style.display = "block";

    });

});

popup.addEventListener("click", () => {

    window.location.href = currentLink;

});


/*
city.addEventListener("mouseleave", () => {

    popup.style.display = "none";

});
*/

document.addEventListener("click", e => {

    if (
        !e.target.closest(".city") &&
        !e.target.closest(".map-popup")
    ) {

        popup.style.display = "none";
    }
});

</script>
