==============================*/

/*==============================
MAP
==============================*/

.map-section{

    width:min(1700px, 92vw);
    margin:0 auto;
    text-align:center;
}

.map-wrapper{

    position:relative;
    display:inline-block;

    width:90%;
    max-width:1500px;
    padding:0;
    border-radius:32px;
    background:rgba(255,255,255,.26);
    overflow:hidden;

}

.japan-map {

    width: 100%;
    display: block;

    filter: drop-shadow(
        0 18px 35px rgba(49,71,110,.10)
    );
}

.map-wrapper::before{

    content:"";
    position:absolute;
    inset:18px;
    border-radius:24px;
    border:1px solid rgba(255,255,255,.45);
    pointer-events:none;
    display:block;
}

.map-popup{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%, -50%);

    width:220px;

    background:rgba(255,255,255,.92);

    border-radius:20px;

    overflow:hidden;

    box-shadow:0 18px 40px rgba(0,0,0,.18);

    display:none;

    z-index:20;
}

.map-popup img{

    width:100%;

    height:140px;

    object-fit:cover;
}

.map-popup h3{

    margin:14px 0 8px;

    font-size:20px;
}

.map-popup a{

    display:block;

    padding:0 0 18px;

    font-size:13px;

    color:#425a7a;

    text-decoration:none;
}

/*==============================
CITY LINK
==============================*/

.city{

    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    width:9px;
    height:9px;
    border-radius:50%;
    text-decoration:none;
    transition:.25s;
    transform: translate(-50%, -50%);
}

.city::before{

    content:"";

    width:9px;
    height:9px;

    background:#3a4455;
    border-radius:50% 50% 50% 0;

    transform:rotate(-45deg);
}

.city:hover::before{

    transform: scale(1.8);
    background:#87A2C6;
}


.city::after {

    content: attr(data-name);

    position: absolute;

    top: -18px;
    left: 50%;

    transform: translateX(-50%);

    color: #101b29;

    font-family: 'Cormorant Garamond', serif;

    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;

    opacity: 0;

    transition: .25s;

    pointer-events: none;
}

.city:hover::after{

    opacity: 1;

    top: -28px;

    transform: translateX(-50%) scale(1.05);
}

<script>
const popup = document.getElementById("popup");

const popupImg = document.getElementById("popup-img");
const popupTitle = document.getElementById("popup-title");
const popupLink = document.getElementById("popup-link");

document.querySelectorAll(".city").forEach(city => {

    city.addEventListener("click", () => {

        popupImg.src = city.dataset.image;

        popupTitle.textContent = city.dataset.title;

        popupLink.href = city.dataset.link;

        popup.style.display = "block";
    });
});

document.addEventListener("click", e => {

    if (
        !e.target.closest(".city") &&
        !e.target.closest(".map-popup")
    ) {

        popup.style.display = "none";
    }
});

</script>
