<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&family=Caveat:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:
        linear-gradient(rgba(246,245,242,0.95), rgba(246,245,242,0.95)),
        url("Images/healing/aqua.jpg");
      background-size:cover;
      background-attachment:fixed;
      font-family:'Montserrat', sans-serif;
      color:#2d3e52;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    img{
      width:100%;
      display:block;
    }

    .back-wrapper{
      width:min(1200px,90%);
      margin:24px auto 0;
    }

    .back-home{
      display:inline-block;
      font-size:11px;
      letter-spacing:1px;
      text-transform:uppercase;
      color:#31476E;
      border-bottom:1px solid #31476E;
      padding-bottom:5px;
    }

    .intro{
      width:min(900px,90%);
      margin:55px auto 45px;
      text-align:center;
    }

    .intro span{
      font-family:'Caveat', cursive;
      font-size:36px;
      letter-spacing:2.5px;
      font-weight: 600;
      color:#637c9e;
    }

    .intro h1{
      margin-top:8px;
      font-family:'Cormorant Garamond', serif;
      font-size:24px;
      color:#31476E;
    }

    .intro p{
      margin-top:14px;
      font-size:12px;
      letter-spacing:3px;
      text-transform:uppercase;
      color:#7d8896;
    }

    .journey-grid{
      width:min(1200px,90%);
      margin:0 auto 60px;

      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:22px;
    }

    .journey-card{
       
      position:relative;
      min-height:90px;
      padding:18px;

      display:flex;
      align-items:center;
      justify-content:center;

      text-align:center;
      overflow:hidden;

      background:rgba(255,255,255,0.72);
      border:1px solid rgba(49,71,110,0.22);
      cursor:pointer;
    }

    .journey-card img{
     position:absolute;
     inset:0;
     filter:none;
     width:100%;
     height:100%;

     object-fit:cover;
     opacity:0.45;

     z-index:0;
    }

   .journey-card::after{
     content:"";
     position:absolute;
     inset:0;

     background:rgba(255,255,255,0.55);
     z-index:1;
    }

   .journey-card-content{
      position:relative;
      z-index:2;
    }

    .journey-card:hover{
      transform:translateY(-7px);
      box-shadow:0 22px 55px rgba(49,71,110,0.14);
    }

    .journey-card.active{
      border-color:#31476E;
      box-shadow:0 0 0 1px rgba(49,71,110,0.25);
      background:rgba(255,255,255,0.92);
    }

    .journey-card-content span{
      font-size:10px;
      letter-spacing:4px;
      color:#4e607a;
      font-size:11px;
    }

    .journey-card-content h3{
      margin:12px 0 ;
      color:#31476E;
      font-weight:600;
      font-family:'Plus Jakarta Sans', sans-serif;
      font-size:16px;
      font-weight:700;
      letter-spacing:-0.5px;
      margin-bottom:10px
    }

    .journey-card-content p{
      font-size:13px;
      line-height:1.8;
      color:#566171;
    }

    .detail-section{
      width:min(1200px,90%);
      margin:0 auto 90px;

      background:rgba(255,255,255,0.76);
      border:1px solid rgba(49,71,110,0.14);
      box-shadow:0 18px 50px rgba(49,71,110,0.08);

      padding:42px;
    }

    .detail-top span{
      font-size:11px;
      letter-spacing:3px;
      text-transform:uppercase;
      color:#8a94a3;
    }

    .detail-top h2{
      margin:8px 0 16px;
      font-family:'Cormorant Garamond', serif;
      font-size:28px;
      color:#31476E;
    }

    .detail-top p{
      max-width:760px;
      font-size:13px;
      line-height:1.6;
      color:#566171;
      white-space:pre-line;
    }

    .place-list{
      margin:28px 0;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .place-list span{
      display:inline-block;
      padding:9px 14px;
      background:rgba(238,243,247,0.9);
      border:1px solid rgba(49,71,110,0.12);
      font-size:11px;
      letter-spacing:1px;
      color:#46566b;
    }

    .photo-grid{
      margin-top:34px;
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:14px;
    }

    .photo-grid img{
      width:100%;
      object-fit:cover;
      border-radius:4px;
    }

    /* 첫 번째, 두 번째 사진 */

    .photo-grid img:nth-child(1),
    .photo-grid img:nth-child(2){

      grid-column:span 2;
      height:280px;
    }

    /* 나머지 작은 사진 */

    .photo-grid img:nth-child(n+3){
      height:150px;
    }

    .photo-grid.small-grid{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:14px;
    }

    .photo-grid.small-grid img{
      width:100%;
      height:150px;
      object-fit:cover;
      border-radius:4px;
    }

    .small-grid img:nth-child(1),
    .small-grid img:nth-child(2){
      grid-column:auto;
      height:150px;
    }

    .place-list button{
      padding:9px 14px;
      background:rgba(238,243,247,0.9);
      border:1px solid rgba(49,71,110,0.12);
      font-size:11px;
      letter-spacing:1px;
      color:#46566b;
      cursor:pointer;
    }

    .place-list button.active{
      background:#31476E;
      color:white;
      border-color:#31476E;
    }

    .note{
      max-width:800px;
      margin-top:40px;
      padding-top:30px;
      border-top:1px solid rgba(49,71,110,.15);
      font-size:15px;
      line-height:2;
      color:#566171;
      white-space:pre-line;
    
    }


   @keyframes zoomIn {
     from {
       transform: scale(0.92);
       opacity: 0;
      }
     to {
       transform: scale(1);
       opacity: 1;
      }
   }

   .close-btn {
     position: absolute;
     top: 24px;
     right: 32px;
     color: white;
     font-size: 34px;
     cursor: pointer;
    }

    body{
      background-attachment:scroll;
    }

      width:88%;
      margin:12px auto 0;
    }

    }

    .intro{
      width:88%;
      margin:24px auto 16px;
      padding:0;
      text-align:center;
    }

    .intro span{
      font-size:11px;
      letter-spacing:3px;
    }

   .intro h1{
     margin-top:6px;
     font-size:18px;
    }

    .intro p{
     display:none;
    }

   .journey-grid{
     width:88%;
     margin:0 auto 20px;
     grid-template-columns:repeat(2, 1fr);
     gap:5px;
    }

   .journey-card{
     min-height:0;
     height: 50px;
     padding:4px;
    }

   .journey-card-content span{
     display:none;
    }

   .journey-card-content h3{
     margin:6px 0 0;
     font-size:12px;
     line-height:1.2;
    }

   .journey-card-content p{
     display:none;
    }

   .detail-section{

     margin:0 auto 30px;
     padding:20px 12px;
    }

     letter-spacing:2px;
    }

   .detail-top h2{

     font-size:16px;
    }

    }

     gap:10px;

   .photo-grid img:nth-child(2),
   .photo-grid img:nth-child(n+3),
   .photo-grid.small-grid img,
   .photo-grid.small-grid img:nth-child(1),
   .photo-grid.small-grid img:nth-child(2){
     grid-column:auto;
     width:100%;
     height:135px;
     object-fit:cover;
    }

   .note{
     margin-top:18px;
     padding-top:20px;
     font-size:12px;
     line-height:1.4;
     letter-spacing:0.8px;
    }

  body.ways-page .modal-nav.prev{

  }

  body.ways-page .modal-nav.next{
    right:18px !important;
  }

</style>

  function showJourney(id, button){
    const data = journeys[id];

    document.getElementById("detail-label").innerText = data.label;
    document.getElementById("detail-title").innerText = data.title;
    document.getElementById("detail-desc").innerText = data.desc;

    document.getElementById("place-list").innerHTML =
      data.places.map((place, index) => `
        <button
          class="${index === 0 ? 'active' : ''}"
          onclick="showPlace('${id}', ${index}, this)"
        >
          ${place.name}
        </button>
      `).join("");

    showPlace(id, 0, document.querySelector("#place-list button"));

    document.querySelectorAll(".journey-card").forEach(card => {
      card.classList.remove("active");
    });

    button.classList.add("active");

    document.getElementById("journey-detail").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  function showPlace(journeyId, placeIndex, button){
  const place = journeys[journeyId].places[placeIndex];
  const grid = document.getElementById("photo-grid");

      grid.className =
        place.layout === "small"
         ? "photo-grid small-grid"
         : "photo-grid";

      grid.innerHTML =
        place.images.map(img => `
          <img src="${img}" alt="" loading="lazy" decoding="async">
       `).join("");

      document.getElementById("detail-note").innerText = place.note;

      document.querySelectorAll("#place-list button").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");
  }
 

function openFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const targetJourney = params.get("journey");
  const targetPlace = params.get("place");

  if(targetJourney && journeys[targetJourney]){
    const journeyBtn = document.querySelector(
      `.journey-card[onclick*="'${targetJourney}'"]`
    );

    showJourney(targetJourney, journeyBtn);

    if(targetPlace){
      const placeIndex = journeys[targetJourney].places.findIndex(place =>
        place.name.toLowerCase().trim() === targetPlace.toLowerCase().trim()
      );

      if(placeIndex >= 0){
        const placeBtn = document.querySelectorAll("#place-list button")[placeIndex];
        showPlace(targetJourney, placeIndex, placeBtn);
      }
    }

    return;
  }

  showJourney("rail", document.querySelector(".journey-card"));
}
